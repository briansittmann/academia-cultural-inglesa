nombre: Academia Cultural Inglesa
siglas: ACI
fundacion: 1979
bajada: Inglés para niños, adolescentes y adultos en Villa Urquiza y Villa del Parque, desde 1979.
descripcion: >-
  La Academia Cultural Inglesa enseña inglés en el barrio desde 1979. Es una empresa
  familiar que está cerca de sus alumnos y acompaña a las familias: seguimos el progreso
  de cada chico y mantenemos una comunicación fluida con los padres. Nuestro staff es
  estable y está formado por docentes egresados de Profesorados Nacionales Superiores de
  Inglés, con material en constante actualización. Queremos que nuestros alumnos confíen
  en sus capacidades y disfruten de aprender.
hechos:
  - Desde 1979 en el barrio
  - Empresa familiar, cerca de sus alumnos
  - Staff estable, egresado de Profesorados Nacionales Superiores de Inglés
  - Seguimiento del progreso y comunicación con los padres
  - Sede de los exámenes Cambridge B2 First y C1 Advanced
