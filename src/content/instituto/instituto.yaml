testDeNivel:
  preguntas: 124
  pasos:
    - Completá tus datos y respondé el test online. Son 124 preguntas; si no sabés una, marcá "No sabe / No contesta".
    - Recibís por mail el resultado con tu nivel.
    - Escribinos por WhatsApp o pedí información para reservar tu lugar.
