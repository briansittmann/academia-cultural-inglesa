nombre: Academia Cultural Inglesa
siglas: ACI
fundacion: 1979
bajada: >-
  Inglés para niños, adolescentes y adultos en Villa Urquiza y Villa del Parque,
  desde 1979.
descripcion: >-
  Desde 1979, la excelencia de enseñar inglés.


  Con una trayectoria de casi cinco décadas, la Academia Cultural Inglesa es una
  institución dedicada a la enseñanza del inglés, donde la tradición académica
  se combina con la innovación y el compromiso educativo.


  Nuestro equipo de docentes egresados de Profesorados Nacionales de Inglés
  garantiza una sólida formación académica, respaldada por materiales de última
  generación y espacios especialmente preparados para aprender.


  Nos distingue una enseñanza personalizada, con especial atención al
  seguimiento y acompañamiento de cada alumno, respetando sus tiempos y
  potenciando sus capacidades.


  En nuestras dos sedes, mantenemos intacta nuestra filosofía: ofrecer una
  educación de calidad en un ambiente cálido, estimulante y profesional.


  Porque aprender inglés es importante. Aprenderlo en el lugar adecuado hace la
  diferencia.


  Academia Cultural Inglesa — Desde 1979, formando generaciones y construyendo
  futuros.
hechos:
  - Desde 1979 enseñando inglés a generaciones de alumnos
  - Enseñanza personalizada, cerca de sus alumnos
  - Staff estable,  de los Profesorados Nacionales Superiores de Inglés
  - Seguimiento del progreso y comunicación con los padres
  - Mas cantidad de horas que la competencia
  - Sede de los exámenes Cambridge B2 First y C1 Advanced
  - Viajes estudiantiles a UK
